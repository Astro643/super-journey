services:
  - type: web
    name: controller
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # BETTER_AUTH_SECRET — random string (`openssl rand -base64 32`)
      # BETTER_AUTH_URL — public URL, e.g. https://controller.onrender.com
      # DATABASE_URL — Render Postgres INTERNAL connection string
      # UPSTASH_BOX_API_KEY — Upstash Box API key
      # GEMINI_API_KEY (or GEMINI_API_KEYS for rotation)
      # optional MODEL_STRONG / MODEL_LITE / MODEL_SUPPORT
